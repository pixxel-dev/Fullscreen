name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set Version Code and Name based on Commit Count
      id: vars
      run: |
        VERSION_CODE=$(git rev-list --count HEAD)
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        # Base version logic: 1.0.0
        # Let's say major version is 1. Minor increments every 10 commits, patch every commit
        # Actually, user wants manual SemVer via gradle, let's just stick to build.gradle for versionName
        # and use git commit count for versionCode so it can always install over.
        echo "VERSION_NAME=$(grep 'versionName ' app/build.gradle | grep -o "\".*\"" | tr -d '"' | head -1)" >> $GITHUB_ENV

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        else
          echo "No keystore secret found, skipping decode."
        fi

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/app-release.apk
