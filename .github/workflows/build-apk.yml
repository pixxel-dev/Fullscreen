name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get Versions
      id: vars
      run: |
        VERSION_CODE=$(git rev-list --count HEAD)
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        VERSION_NAME=$(grep 'versionName ' app/build.gradle | grep -o "\".*\"" | tr -d '"' | head -1)
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "TAG_NAME=v${VERSION_NAME}-build${VERSION_CODE}" >> $GITHUB_ENV

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        else
          echo "No keystore secret found, skipping decode."
        fi

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }}

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Release ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
        body: |
          Auto-generated release for version ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          * Commit: ${{ github.sha }}
        files: app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
