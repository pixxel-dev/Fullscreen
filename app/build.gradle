plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flyme.fscrn'
    compileSdk 34

    defaultConfig {
        applicationId "com.flyme.fscrn"
        minSdk 28
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 5
        versionName "1.1.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "default_password"
            keyAlias System.getenv("KEY_ALIAS") ?: "key0"
            keyPassword System.getenv("KEY_PASSWORD") ?: "default_password"
        }
    }

    buildTypes {
        debug {
            // Using default debug keystore
        }
        release {
            minifyEnabled true
            shrinkResources true

            def keystoreFile = file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            // only apply release signing if the file actually exists and is not empty
            if (keystoreFile.exists() && keystoreFile.length() > 0) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Shizuku API (Base for future root/system access as defined in BACKLOG.md)
    def shizuku_version = '13.1.0'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
}
